on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "pom.xml"
      - ".github/workflows/codecov.yml"

name: Maven Build

permissions:
  contents: read

jobs:
  generic_handler:
    name: Maven Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('backend/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 21
          check-latest: false

      # Keep Surefire's argLine defined when the JaCoCo agent is disabled.
      - name: Test and package with Maven
        run: >-
          mvn -B clean package -Djacoco.skip=true -DargLine=
          -DskipAntRunForJenkins --file pom.xml -pl '!frontend'
