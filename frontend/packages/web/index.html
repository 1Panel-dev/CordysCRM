<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cordys CRM</title>
  </head>
  <script type="module">
    function isMobileDevice() {
      return /Mobile|Android/i.test(navigator.userAgent);
    }

    if (isMobileDevice()) {
      const mobileEntry = import.meta.env.DEV ? 'http://localhost:3000/' : `${window.location.origin}/mobile`;
      window.location.replace(`${mobileEntry}${window.location.search}${window.location.hash}`);
    } else {
      import('/src/main.ts');
    }
  </script>
  <body>
    <div id="app"></div>
  </body>
</html>
